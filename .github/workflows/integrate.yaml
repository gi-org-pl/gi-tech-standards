name: lint

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  lint:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v6
      - name: 'Install markdownlint-cli'
        run: npm install -g markdownlint-cli
      - name: 'Lint markdown files'
        run: markdownlint '**/*.md'

  pre-check-scripts:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 'Test the front-end pre-check scripts'
        run: |
          python3 -m unittest discover -s .github/frontend-pre-check -v
          bash .github/frontend-pre-check/test_report.sh
